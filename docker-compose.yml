version: '3.8'

services:
  solana_payment:
    build: .
    container_name: solana_payment
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app
    environment:
      - SOLANA_RPC_URL=https://api.mainnet-beta.solana.com
      - WALLET_DATA_DIR=/app
      - COMMISSION_PERCENTAGE=5
    user: "1000:1000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
